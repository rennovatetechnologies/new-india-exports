openapi: 3.0.3
info:
  title: 'New India Export / VIRASTRA API'
  version: 2.3.0
  description: "Production Express API for customer onboarding, OTP auth, KYC, cases, Razorpay payments, GST invoices, events, and admin ops.\n\n**Auth:** Email OTP only. Send `Authorization: Bearer <JWT>` for protected routes.\n\n**Money:** Amounts in INR rupees in API/DB; converted to paise only for Razorpay.\n\n**Envelope:** `{ success, data?, message? }` on success; `{ success: false, message, code?, details? }` on errors.\n\nLegacy vault/shipment routes under `/api/cases/...` exist only when `ENABLE_LEGACY_SHIPMENT=true`."
  contact:
    name: 'New India Export'
    email: support@newindiaexport.com
servers:
  -
    url: /
    description: 'Current host'
  -
    url: 'http://127.0.0.1:5001'
    description: Local
tags:
  -
    name: System
  -
    name: Auth
  -
    name: Staff
  -
    name: RBAC
  -
    name: KYC
  -
    name: Cases
  -
    name: Payments
  -
    name: Invoices
  -
    name: Plans
  -
    name: Events
  -
    name: Brochures
  -
    name: Me
  -
    name: Admin
  -
    name: Support
  -
    name: Files
  -
    name: 'Vault (legacy)'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT from OTP verify / login. Claims: sub, email, role, status.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 'Recommended for money / submit endpoints'
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
        message:
          type: string
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
        details:
          type: array
          items: {}
    OtpPurpose:
      type: string
      enum:
        - customer_login
        - customer_signup
        - staff_login
        - staff_register
    OtpSend:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        name:
          type: string
          maxLength: 120
        company:
          type: string
          maxLength: 200
        phone:
          type: string
    OtpVerify:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        code:
          type: string
          description: '6-digit OTP'
        otp:
          type: string
          description: 'Alias for code'
    CustomerSignup:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        company:
          type: string
        phone:
          type: string
    LoginWithCode:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
    StaffRegister:
      type: object
      required:
        - email
        - name
        - phone
        - reason
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - operations
            - admin
          default: operations
        department:
          type: string
        employeeId:
          type: string
        reason:
          type: string
    StaffAccessPatch:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Pending
            - Approved
            - Rejected
            - Suspended
        permissions:
          type: array
          items:
            type: string
        reason:
          type: string
    StaffUserPatch:
      type: object
      properties:
        role:
          type: string
          enum:
            - customer
            - operations
            - admin
        status:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    StaffPermissions:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    KycProfile:
      type: object
      properties:
        legalName:
          type: string
        legalEntityName:
          type: string
        entityType:
          type: string
        incorporationDate:
          type: string
        turnover:
          type: string
        registeredAddress:
          type: string
        operatingCity:
          type: string
        signatoryName:
          type: string
        fullName:
          type: string
        designation:
          type: string
        panNumber:
          type: string
        pan:
          type: string
        aadhaarLast4:
          type: string
          pattern: '^\d{4}$'
      additionalProperties: true
    SelectPlan:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
    AssignCase:
      type: object
      required:
        - opsEmail
      properties:
        opsEmail:
          type: string
          format: email
        opsName:
          type: string
    StageNote:
      type: object
      properties:
        note:
          type: string
    StageReject:
      type: object
      properties:
        reason:
          type: string
    CaseNote:
      type: object
      properties:
        body:
          type: string
        note:
          type: string
    CaseMessage:
      type: object
      required:
        - body
      properties:
        body:
          type: string
        message:
          type: string
    DocRequest:
      type: object
      properties:
        label:
          type: string
        reason:
          type: string
    CreateOrder:
      type: object
      properties:
        purpose:
          type: string
          enum:
            - plan
            - plan_upgrade
            - event
            - workshop
            - booking
            - custom
        planId:
          type: string
        eventId:
          type: string
        email:
          type: string
          format: email
        amount:
          type: number
          description: 'INR rupees'
        currency:
          type: string
          default: INR
        description:
          type: string
        notes:
          type: object
          additionalProperties: true
      additionalProperties: true
    VerifyPayment:
      type: object
      required:
        - razorpay_order_id
        - razorpay_payment_id
        - razorpay_signature
      properties:
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
    Booking:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        company:
          type: string
        planId:
          type: string
        eventId:
          type: string
        notes:
          type: string
        paymentId:
          type: string
      additionalProperties: true
    WorkshopRegister:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        company:
          type: string
        phone:
          type: string
        razorpay_payment_id:
          type: string
        paymentId:
          type: string
      additionalProperties: true
    PlanCreate:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        tagline:
          type: string
        featured:
          type: boolean
        features:
          type: array
          items:
            type: string
        kycDocs:
          type: array
          items:
            type: object
        workflowStages:
          type: array
          items: {}
    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        discountPercent:
          type: number
        tagline:
          type: string
        featured:
          type: boolean
        features:
          type: array
          items:
            type: string
        kycDocs:
          type: array
          items:
            type: object
        workflowStages:
          type: array
          items: {}
    EventUpsert:
      type: object
      required:
        - title
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
        city:
          type: string
        img:
          type: string
        seats:
          type: string
        capacity:
          type: string
        desc:
          type: string
        priceInr:
          type: number
        price:
          type: number
    EventUpdate:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        city:
          type: string
        img:
          type: string
        seats:
          type: string
        capacity:
          type: string
        desc:
          type: string
        priceInr:
          type: number
        price:
          type: number
    BrochureUpsert:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        fileUrl:
          type: string
        file:
          type: string
          format: binary
    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        name:
          type: string
        designation:
          type: string
        phone:
          type: string
    CompanyUpdate:
      type: object
      properties:
        legalEntity:
          type: string
        gstin:
          type: string
        iec:
          type: string
        adCode:
          type: string
        registeredAddress:
          type: string
    TeamInvite:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - Viewer
            - Editor
            - Admin
            - Owner
          default: Viewer
    NotificationPrefs:
      type: object
      properties:
        workflow:
          type: boolean
        billing:
          type: boolean
        weekly:
          type: boolean
        marketing:
          type: boolean
    SupportTicket:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        subject:
          type: string
        body:
          type: string
        message:
          type: string
    LeadContact:
      type: object
      required:
        - email
        - name
        - message
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        company:
          type: string
        message:
          type: string
        source:
          type: string
    ConciergeBook:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        company:
          type: string
        preferredSlot:
          type: string
        message:
          type: string
    OpsRoster:
      type: object
      properties:
        roster:
          type: array
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
              name:
                type: string
              active:
                type: boolean
    KycNeedsMore:
      type: object
      properties:
        reason:
          type: string
  responses:
    BadRequest:
      description: 'Validation / bad request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Missing or invalid JWT'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Insufficient role / ACL'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /:
    get:
      summary: 'Backend status'
      tags:
        - System
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  version: {type: string}
                  env: {type: string}
      security: []
  /health:
    get:
      summary: 'Health check'
      tags:
        - System
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  env: {type: string}
      security: []
  /api/webhooks/razorpay:
    post:
      summary: 'Razorpay webhook'
      tags:
        - Payments
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'
      description: 'Raw JSON body. Validates `x-razorpay-signature`. Handles payment.captured / order.paid / payment.failed.'
      security: []
      parameters:
        -
          name: x-razorpay-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
  /api/auth/otp/send:
    post:
      summary: 'Send OTP'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSend'
  /api/auth/otp/resend:
    post:
      summary: 'Resend OTP'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSend'
  /api/auth/otp/verify:
    post:
      summary: 'Verify OTP (returns session for login purposes)'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
  /api/auth/customer/signup:
    post:
      summary: 'Complete customer signup after email verified'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSignup'
  /api/auth/customer/login:
    post:
      summary: 'Customer OTP login'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWithCode'
  /api/auth/staff/login:
    post:
      summary: 'Staff OTP login (no passwords)'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWithCode'
  /api/auth/staff/register:
    post:
      summary: 'Submit staff access request'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegister'
  /api/auth/me:
    get:
      summary: 'Current authenticated user'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
  /api/auth/logout:
    post:
      summary: 'Logout (audit; JWT is client-side)'
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
  /api/staff/access-requests:
    get:
      summary: 'List staff access requests'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
        -
          name: q
          in: query
          required: false
          schema:
            type: string
  '/api/staff/access-requests/{reqId}':
    get:
      summary: 'Get staff access request'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: reqId
          in: path
          required: true
          schema:
            type: string
          description: null
    patch:
      summary: 'Approve / reject / suspend request'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: reqId
          in: path
          required: true
          schema:
            type: string
          description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAccessPatch'
  /api/staff/users:
    get:
      summary: 'List staff users'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
  '/api/staff/users/{email}':
    patch:
      summary: 'Update staff user'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: email
          in: path
          required: true
          schema:
            type: string
          description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserPatch'
  '/api/staff/users/{email}/permissions':
    patch:
      summary: 'Set staff permissions'
      tags:
        - Staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: email
          in: path
          required: true
          schema:
            type: string
          description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPermissions'
  /api/rbac/matrix:
