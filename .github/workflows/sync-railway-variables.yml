name: Sync GitHub secrets to Railway

# Backend only. GitHub Actions secrets are the source of truth.
# This job writes them as a .env and sets the same KEY=VALUE pairs on the
# new-india-exports Railway service, then redeploys.
#
# Needs GitHub secret RAILWAY_TOKEN (Railway → Account → Tokens).
# Project/service IDs are already stored as GitHub secrets.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Write .env from GitHub secrets and set on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          APP_ENV: ${{ secrets.APP_ENV }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          MONGODB_DB_NAME_NONPROD: ${{ secrets.MONGODB_DB_NAME_NONPROD }}
          MONGODB_DB_NAME_PROD: ${{ secrets.MONGODB_DB_NAME_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_HOURS: ${{ secrets.JWT_EXPIRE_HOURS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ENABLE_DOCS: ${{ secrets.ENABLE_DOCS }}
          ENABLE_LEGACY_SHIPMENT: ${{ secrets.ENABLE_LEGACY_SHIPMENT }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GST_RATE: ${{ secrets.GST_RATE }}
          WORKSHOP_AMOUNT_INR: ${{ secrets.WORKSHOP_AMOUNT_INR }}
          BOOKING_AMOUNT_INR: ${{ secrets.BOOKING_AMOUNT_INR }}
          OTP_TTL_MINUTES: ${{ secrets.OTP_TTL_MINUTES }}
          OTP_RATE_LIMIT: ${{ secrets.OTP_RATE_LIMIT }}
          DISABLE_RATE_LIMITS: ${{ secrets.DISABLE_RATE_LIMITS }}
          ENABLE_EMAIL_NOTIFICATIONS: ${{ secrets.ENABLE_EMAIL_NOTIFICATIONS }}
          ENABLE_EMAIL_OTP: ${{ secrets.ENABLE_EMAIL_OTP }}
          ENABLE_WHATSAPP_NOTIFICATIONS: ${{ secrets.ENABLE_WHATSAPP_NOTIFICATIONS }}
          ENABLE_WHATSAPP_OTP: ${{ secrets.ENABLE_WHATSAPP_OTP }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}
          WHATSAPP_DEFAULT_COUNTRY_CODE: ${{ secrets.WHATSAPP_DEFAULT_COUNTRY_CODE }}
          WHATSAPP_OTP_TEMPLATE: ${{ secrets.WHATSAPP_OTP_TEMPLATE }}
          WHATSAPP_OTP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_OTP_TEMPLATE_LANG }}
          WHATSAPP_OTP_BUTTON: ${{ secrets.WHATSAPP_OTP_BUTTON }}
          WHATSAPP_NOTIFY_TEMPLATE: ${{ secrets.WHATSAPP_NOTIFY_TEMPLATE }}
          WHATSAPP_NOTIFY_TEMPLATE_LANG: ${{ secrets.WHATSAPP_NOTIFY_TEMPLATE_LANG }}
          WHATSAPP_ALLOW_SESSION_TEXT: ${{ secrets.WHATSAPP_ALLOW_SESSION_TEXT }}
          MAX_UPLOAD_BYTES: ${{ secrets.MAX_UPLOAD_BYTES }}
          MAX_CASE_UPLOAD_BYTES: ${{ secrets.MAX_CASE_UPLOAD_BYTES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          OPS_INBOX: ${{ secrets.OPS_INBOX }}
          ADMIN_INBOX: ${{ secrets.ADMIN_INBOX }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          APP_NAME: ${{ secrets.APP_NAME }}
          AUDIT_LOG_TTL_DAYS: ${{ secrets.AUDIT_LOG_TTL_DAYS }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          GCS_ENV_FOLDER: ${{ secrets.GCS_ENV_FOLDER }}
          GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Add GitHub secret RAILWAY_TOKEN, then re-run this workflow."
            exit 1
          fi
          ENV_NAME="${RAILWAY_ENVIRONMENT_ID:-production}"
          python3 - <<'PY'
          import os
          keys = """
            APP_ENV MONGODB_URI MONGODB_DB_NAME MONGODB_DB_NAME_NONPROD MONGODB_DB_NAME_PROD
            JWT_SECRET JWT_EXPIRE_HOURS CORS_ORIGINS FRONTEND_URL ENABLE_DOCS ENABLE_LEGACY_SHIPMENT
            RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET
            GST_RATE WORKSHOP_AMOUNT_INR BOOKING_AMOUNT_INR
            OTP_TTL_MINUTES OTP_RATE_LIMIT DISABLE_RATE_LIMITS AUDIT_LOG_TTL_DAYS
            ENABLE_EMAIL_NOTIFICATIONS ENABLE_EMAIL_OTP ENABLE_WHATSAPP_NOTIFICATIONS ENABLE_WHATSAPP_OTP
            WHATSAPP_PHONE_NUMBER_ID WHATSAPP_ACCESS_TOKEN WHATSAPP_BUSINESS_ACCOUNT_ID
            WHATSAPP_API_VERSION WHATSAPP_DEFAULT_COUNTRY_CODE
            WHATSAPP_OTP_TEMPLATE WHATSAPP_OTP_TEMPLATE_LANG WHATSAPP_OTP_BUTTON
            WHATSAPP_NOTIFY_TEMPLATE WHATSAPP_NOTIFY_TEMPLATE_LANG WHATSAPP_ALLOW_SESSION_TEXT
            MAX_UPLOAD_BYTES MAX_CASE_UPLOAD_BYTES
            RESEND_API_KEY MAIL_FROM MAIL_REPLY_TO OPS_INBOX ADMIN_INBOX SUPPORT_EMAIL APP_NAME
            GCS_BUCKET GCS_PROJECT_ID GCS_ENV_FOLDER GCS_CREDENTIALS_JSON
          """.split()
          names = []
          with open(".env.keys", "w", encoding="utf-8") as f:
              for key in keys:
                  if os.environ.get(key, ""):
                      f.write(key + "\n")
                      names.append(key)
          print(f"Backend .env keys to set: {len(names)}")
          PY
          while IFS= read -r key || [ -n "$key" ]; do
            [ -z "$key" ] && continue
            printf '%s' "${!key}" | railway variable set "$key" --stdin --skip-deploys \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$ENV_NAME"
          done < .env.keys
          echo "Backend variables set. Redeploying."
          railway redeploy \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$ENV_NAME" \
            --yes
